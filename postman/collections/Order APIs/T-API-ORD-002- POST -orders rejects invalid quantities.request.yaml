name: "T-API-ORD-002: POST /orders rejects invalid quantities"
description: |-
  Steps:
  1. POST quantity 0
  2. POST quantity -1
  3. POST a string quantity
  4. POST quantity above available stock
  5. POST quantity equal to stock

  Expected: Invalid quantities return 400/422 with field-level messages and no order is created; quantity equal to stock is accepted
