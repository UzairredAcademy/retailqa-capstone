$kind: http-request
name: "T-API-DEL-001B: GET tracking by unknown number returns 404 and clear message"
description: |-
  Steps:
  1. GET /api/tracking/UNKNOWN-TRACKING-99999
  2. Assert not-found response

  Expected: Unknown tracking numbers return 404 with a clear message
url: "{{base_url}}/api/tracking/UNKNOWN-TRACKING-99999"
method: GET
headers:
  Authorization: Bearer {{auth_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("T-API-DEL-001B: unknown tracking number returns 404", function () {
          pm.expect(pm.response.code).to.equal(404);
      });

      pm.test("T-API-DEL-001B: response contains a clear not-found message", function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('message');
          pm.expect(body.message).to.match(/not found|unknown/i);
      });
    language: text/javascript
order: 1001
